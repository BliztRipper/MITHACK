# Clinical thresholds. status "placeholder" = not clinically validated: the UI must show
# "placeholder, not clinically validated" next to these (spec: Configurable thresholds).
# status "published" = taken from the named guideline/paper, still shown in the About panel.
triage:            # single source: rules/triage.py reads these at call time
  p_high:       {value: 0.70, status: placeholder}   # at or above: likely CRAO
  p_low:        {value: 0.30, status: placeholder}   # below: unlikely
  quality_min:  {value: 0.5,  status: placeholder}   # below: RETAKE
  hyperacute_h: {value: 4.5,  status: placeholder}   # stroke-pathway window
  acute_h:      {value: 24.0, status: placeholder}   # normal-photo escalation window
risk:
  # Lower edges of bands 2..4, in percent (band 1 is below the first edge).
  pce_band_edges:  {value: [5.0, 7.5, 20.0],  status: published, source: "2018 AHA/ACC cholesterol guideline"}
  # Inclusive valid input ranges; outside -> "not valid", never clamped.
  pce_ranges:
    age: {value: [40, 79],   status: published, source: "Goff 2013"}
    tc:  {value: [130, 320], status: published, source: "Goff 2013"}
    hdl: {value: [20, 100],  status: published, source: "Goff 2013"}
    sbp: {value: [90, 200],  status: published, source: "Goff 2013"}
  ldl_statin_benefit: {value: 190, status: published, source: "2018 AHA/ACC"}   # mg/dL
  arcus_prompt_age:   {value: 45,  status: published, source: "spec: arcus senilis prompt"}
  # Literature placeholder (normal A:V ratio about 2:3 or wider); unverified for Thai adults and for
  # Knudtson zone B (open question in design.md). Inclusive [low, high]; below low = arteriolar narrowing.
  avr_reference:      {value: [0.67, 1.0], status: placeholder, source: "literature placeholder, not validated"}
monitoring:        # drift alerts over the last `window` cases (spec: model-monitoring)
  window:              {value: 50,   status: placeholder}
  quality_reject_max:  {value: 0.30, status: placeholder}   # quality-gate rejection rate
  uncertain_max:       {value: 0.30, status: placeholder}   # uncertain-band rate (Emergency)
  override_max:        {value: 0.20, status: placeholder}   # override rate among signed cases
  agreement_max:       {value: 0.98, status: placeholder}   # above: possible rubber-stamping
  calibration_min:     {value: 30,   status: placeholder}   # signed Emergency cases before calibration shows
