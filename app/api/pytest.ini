[pytest]
pythonpath = .
testpaths = tests
addopts = -m "not slow"
markers =
    slow: runs AutoMorph or a model on MPS (deselected by default; run with -m slow)
# matplotlib (imported by grad-cam) calls pyparsing APIs the installed pyparsing deprecates
filterwarnings =
    ignore:.* deprecated - use .*:DeprecationWarning
