name: CI

on:
  push:
  pull_request:

# The Playwright e2e needs IRIS, the API and secrets, so it runs locally only (README "Tests").
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/api
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # AutoMorph (vision/automorph) is imported by the vision tests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deps
        # CPU wheels first: the default Linux torch wheel pulls ~2 GB of CUDA
        run: |
          pip install torch==2.3.1 torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: pytest (IRIS and slow tests skip without FHIR_USER/MPS)
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
